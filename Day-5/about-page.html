<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        ol {
            padding: 20px;
            background-color: burlywood;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            list-style: none;
        }

        li {
            margin: 10px;
            background-color: cadetblue;
            padding: 20px;
        }
        
        li:hover{
            animation-name: scaling;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            cursor: pointer;
        }



        @keyframes scaling {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.2);
                border-radius: 20px;
                font-weight: bold;
                font-style: italic;
                color: aliceblue;
            }
        }








        /* mobile view port  */
        @media screen and (max-width:412px) {
            ol {
                flex-direction: column;
                justify-content: start;
                align-items: baseline;
                background-color: chocolate;
            }

            li {
                text-align: center;
                font-weight: bold;
                width: 150px;
                font-style: italic;
                color: aliceblue;
                background-color: burlywood;
            }
        }

        /* tab view port  */
        @media screen and (min-width:412px) and (max-width:800px) {
            ol {
                flex-wrap: wrap;
                background-color: palevioletred;
            }

            li {
                background-color: black;
                color: aliceblue;
                font-weight: bold;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <ol>
            <li>HOME</li>
            <li>ABOUT</li>
            <li>CONTACT</li>
            <li>LOGIN</li>
            <li>REGISTER</li>
            <li>HELP</li>
        </ol>
    </nav>
</body>

</html>
