<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSBC Job Application</title>
</head>

<body>
    <form action="">
        <fieldset>
            <legend>HSBC </legend>

            <h2 align="center">HSBC Job Registration Form</h2>
            <label for="fname">First Name :</label>
            <input type="text" id="fname" placeholder="Enter First Name">

            <br><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" placeholder="Enter Last Name">

            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter Email">

            <br><br>
            <label for="phoneNo">Phone No:</label>
            <input type="tel" id="phoneNo" placeholder="Enter Email">

            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob">

            <br><br>
            <label for="gender">Gender :</label>
            <input type="radio" name="gender" value="Male" id="gender"> Male
            <input type="radio" name="gender" value="female" id="gender"> Female
            <input type="radio" name="gender" value="Others" id="gender"> Others


            <br><br>
            <label for="state">State :</label>
            <select id="state">
                <option value="">Choose State</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="AP">AP</option>
            </select>

            <br><br>
            <label for="skills">Skills :</label>
            <input type="checkbox" id="skills" value="React JS"> React JS
            <input type="checkbox" id="skills" value="Node & Express JS"> Node & Express JS
            <input type="checkbox" id="skills" value="API Integration & API Testing"> API Integration & API Testing
            <input type="checkbox" id="skills" value="Nosql (MongoDb)"> Nosql (MongoDb)

            <br><br>
            <label for="address">Address:</label>
            <textarea placeholder="Enter Full Address" id="address"></textarea>

            <br><br>
            <label for="resume">Resume</label>
            <input type="file" accept=".pdf" id="resume">

            <br><br>
            <input type="image" height="30" width="150"
                src="https://png.pngtree.com/png-vector/20230527/ourmid/pngtree-3d-register-now-vector-png-image_7111488.png">
            <button type="reset">Cancel</button>
        </fieldset>
    </form>
</body>

</html>
